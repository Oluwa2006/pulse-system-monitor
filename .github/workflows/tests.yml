name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Linux and macOS only, matching what the README claims is supported.
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]

    env:
      # The suite covers the main-process modules, none of which need the
      # Electron binary. Skipping the ~100 MB download keeps runs under a minute.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm test
